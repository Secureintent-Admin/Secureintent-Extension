# Paths whose "secrets" are deliberately fake.
#
# This repo ships the detector's own test corpus: strings shaped exactly like an
# AWS key, a GitHub PAT, a Stripe key and so on, because a detector that is only
# ever tested against made-up shapes proves nothing. Every value below is
# synthetic — padded 1234567890/abcdefghij runs, or a vendor's own published
# documentation sample — and none of them authenticate against anything.
#
# Without this, secret scanning files an alert for each one on every push.
#
# Note: this governs scanning ALERTS. Push protection is configured separately at
# the org/repo level, so if a push is ever blocked here, the fixtures need to
# stop being literals rather than be exempted (see the fixtures module plan).
paths-ignore:
  - 'docs/test-payloads.md'
  - 'e2e/live.spec.ts'
  - 'src/lib/detection/*.test.ts'
  - 'src/entrypoints/welcome/main.tsx'
